apply plugin: 'com.android.application'

android {
    if (project.hasProperty('formalDevice185')) { testBuildType "release" }
    buildFeatures { buildConfig true }
    // The historical protocol probe is x86_64-only; UI checks need no JNI probe.
    if (project.hasProperty('uiQa185') || project.hasProperty('gardenQa186')) {
        sourceSets { androidTest { jniLibs.srcDirs = [] } }
    }
    if (project.hasProperty('gardenProbe189')) {
        sourceSets { androidTest { jniLibs.srcDirs = ['src/androidTest/garden189Jni'] } }
    }
    if (project.hasProperty('expeditionProbe192')) {
        sourceSets { androidTest { jniLibs.srcDirs = ['src/androidTest/expedition192Jni'] } }
    }
    if (project.hasProperty('guestProbe193')) {
        sourceSets { androidTest { jniLibs.srcDirs = ['src/androidTest/guest193Jni'] } }
    }
    compileSdk 35
    ndkVersion "28.2.13676358"
    namespace "com.xenris.liquidwarsos"
    defaultConfig {
        applicationId "com.xenris.liquidwarsos.haoke"
        manifestPlaceholders = [appLabel: project.hasProperty('gardenQa186') ? '液态战争 · 3D试玩' : '@string/app_name']
        minSdk 26
        targetSdk 34
        versionName "1.94"
        versionCode 64
        resValue "string", "ui_version", versionName
        resourceConfigurations += ["en", "zh", "b+zh+Hant"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            ndkBuild {
                targets "nativeinterface"
                abiFilters(* (project.hasProperty('godotQaAbi') ? [project.property('godotQaAbi')] : ["armeabi-v7a", "x86", "arm64-v8a", "x86_64"]))
            }
        }
        ndk {
            abiFilters(* (project.hasProperty('godotQaAbi') ? [project.property('godotQaAbi')] : ["armeabi-v7a", "x86", "arm64-v8a", "x86_64"]))
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            multiDexEnabled true
        }
        debug {
            jniDebuggable true
            renderscriptDebuggable true
            minifyEnabled false
            multiDexEnabled false
            applicationIdSuffix project.hasProperty('gardenQa186') ? '.garden186' : project.hasProperty('uiQa185') ? '.ui185' : project.hasProperty('onlinePeer') ? '.qa_peer' : '.debug'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path = file("src/main/cpp/Android.mk")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/MANIFEST.MF', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/ASL2.0']
        }
    }
}

repositories {
    maven { url "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    implementation "org.godotengine:godot:4.7.2.stable"
    implementation "net.i2p.crypto:eddsa:0.3.0"
    testImplementation "org.json:json:20240303"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    implementation "androidx.browser:browser:1.7.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    implementation "com.google.android.material:material:1.11.0"
}
